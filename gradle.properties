# Build-wide defaults for Gradle memory, AndroidX, and Kotlin style. Non-transitive R classes keep a
# module's generated resource class limited to its own resources; dependencies use their own R class.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
